paths:
  /api/additional-observations:
    get:
      summary: Listar todas las observaciones adicionales
      tags:
        - Observaciones Adicionales
      responses:
        '200':
          description: Lista de observaciones adicionales
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdditionalObservationResource'
        '401':
          description: No autorizado
    post:
      summary: Crear una nueva observación adicional
      tags:
        - Observaciones Adicionales
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreAdditionalObservationRequest'
      responses:
        '201':
          description: Observación creada exitosamente
        '400':
          description: Error de validación
        '401':
          description: No autorizado
  /api/additional-observations/{id}:
    get:
      summary: Obtener una observación adicional por ID
      tags:
        - Observaciones Adicionales
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID de la observación adicional
      responses:
        '200':
          description: Observación encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdditionalObservationResource'
        '404':
          description: Observación no encontrada
    patch:
      summary: Actualizar una observación adicional existente
      tags:
        - Observaciones Adicionales
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID de la observación adicional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAdditionalObservationRequest'
      responses:
        '200':
          description: Observación actualizada exitosamente
        '400':
          description: Error de validación
        '404':
          description: Observación no encontrada
    delete:
      summary: Eliminar una observación adicional existente
      tags:
        - Observaciones Adicionales
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID de la observación adicional
      responses:
        '204':
          description: Observación eliminada exitosamente
        '404':
          description: Observación no encontrada
  /api/additional-payments:
    get:
      summary: Listar todos los pagos adicionales
      tags:
        - Pagos Adicionales
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de pagos adicionales
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdditionalPaymentCollection'
        '401':
          description: Error de autorización
    post:
      summary: Crear un nuevo pago adicional
      tags:
        - Pagos Adicionales
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreAdditionalPaymentRequest'
      responses:
        '201':
          description: Pago adicional creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdditionalPaymentResource'
        '401':
          description: Error de autorización
        '404':
          description: Recurso no encontrado
  /api/additional-payments/{id}:
    get:
      summary: Obtener un pago adicional por ID
      tags:
        - Pagos Adicionales
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Pago adicional encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdditionalPaymentResource'
        '404':
          description: Recurso no encontrado
        '500':
          description: Error al obtener el pago adicional
    patch:
      summary: Actualizar un pago adicional existente
      tags:
        - Pagos Adicionales
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAdditionalPaymentRequest'
      responses:
        '200':
          description: Pago adicional actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdditionalPaymentResource'
        '404':
          description: Recurso no encontrado
        '500':
          description: Error al actualizar el pago adicional
    delete:
      summary: Cancelar un pago adicional existente
      tags:
        - Pagos Adicionales
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Pago adicional cancelado exitosamente
        '404':
          description: Recurso no encontrado
        '500':
          description: Error al cancelar el pago adicional
  /api/payment-agreements:
    get:
      summary: Listar convenios de pago
      tags:
        - Convenios
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de convenios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgreementCollection'
        '401':
          description: No autorizado
    post:
      summary: Crear un nuevo convenio de pago
      tags:
        - Convenios
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreAgreementRequest'
      responses:
        '201':
          description: Convenio creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgreementResource'
        '401':
          description: No autorizado
        '500':
          description: Error al crear el convenio
  /api/payment-agreements/{id}:
    get:
      summary: Obtener convenio por ID
      tags:
        - Convenios
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Convenio encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgreementResource'
        '401':
          description: No autorizado
        '404':
          description: Convenio no encontrado
    delete:
      summary: Cancelar convenio
      tags:
        - Convenios
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Convenio cancelado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Convenio eliminado exitosamente.
        '404':
          description: Convenio no encontrado
        '500':
          description: Error al cancelar el convenio
  /api/payment-agreements/customer/{id}:
    get:
      summary: Listar fechas de pago de convenio por cliente
      tags:
        - Convenios
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Fechas de pago encontradas
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment_agreement:
                    $ref: '#/components/schemas/AgreementResource'
                  breakdown_agreement_payments:
                    $ref: '#/components/schemas/BreakdownAgreementPaymentCollection'
        '401':
          description: No autorizado
        '404':
          description: Convenio no encontrado
  /api/payment-agreements/breakdown_agreement/{id}:
    post:
      summary: Realizar pago parcial de convenio
      tags:
        - Convenios
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Pago realizado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Pago realizado exitosamente.
        '404':
          description: Convenio no encontrado
        '500':
          description: Error al realizar el pago
  /api/payment-agreements/report/{id}:
    post:
      summary: Generar reporte por incumplimiento de convenio
      tags:
        - Convenios
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Reporte generado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  message:
                    type: string
                    example: Reporte generado correctamente.
        '404':
          description: Convenio no encontrado
        '500':
          description: Error al generar el reporte
  /api/payment-agreements/filter-date:
    get:
      summary: Filtrar pagos de convenio por mes y año
      tags:
        - Convenios
      security:
        - bearerAuth: []
      parameters:
        - name: month
          in: query
          required: false
          schema:
            type: string
            example: '08'
        - name: year
          in: query
          required: false
          schema:
            type: string
            example: '2025'
      responses:
        '200':
          description: Lista de pagos filtrados por mes y año
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreakdownAgreementPaymentCollection'
        '401':
          description: No autorizado
  /api/login:
    post:
      summary: Iniciar sesión y obtener token
      tags:
        - Autenticación
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Usuario y token de acceso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResource'
        '401':
          description: Credenciales inválidas
  /api/register:
    post:
      summary: Registrar un nuevo usuario
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario registrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResource'
        '400':
          description: Error de validación
  /api/logout:
    post:
      summary: Cerrar sesión
      tags:
        - Autenticación
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Sesión cerrada exitosamente
        '401':
          description: Error de autorización
  /api/register/invitation:
    post:
      summary: Enviar un token para registrarse
      tags:
        - Autenticación
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationRequest'
      responses:
        '201':
          description: Correo de invitación enviado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResource'
        '400':
          description: Error de validación
        '401':
          description: Error de autorización
  /api/beneficiaries:
    get:
      summary: Listar todos los beneficiarios
      tags:
        - Beneficiarios
      security:
        - bearerAuth: []
      parameters:
        - name: customer_id
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Lista de beneficiarios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeneficiaryCollection'
        '401':
          description: Error de autorización
    post:
      summary: Crear un nuevo beneficiario
      tags:
        - Beneficiarios
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreBeneficiaryRequest'
      responses:
        '201':
          description: Beneficiario creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeneficiaryResource'
        '401':
          description: Error de autorización
        '404':
          description: Recurso no encontrado
  /api/beneficiaries/{id}:
    get:
      summary: Obtener un beneficiario por ID
      tags:
        - Beneficiarios
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Beneficiario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeneficiaryResource'
        '404':
          description: Recurso no encontrado
        '500':
          description: Error al obtener el beneficiario
    put:
      summary: Actualizar un beneficiario existente
      tags:
        - Beneficiarios
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBeneficiaryRequest'
      responses:
        '200':
          description: Beneficiario actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeneficiaryResource'
        '404':
          description: Recurso no encontrado
        '500':
          description: Error al actualizar el beneficiario
    delete:
      summary: Eliminar un beneficiario existente
      tags:
        - Beneficiarios
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Beneficiario eliminado exitosamente
        '404':
          description: Recurso no encontrado
        '500':
          description: Error al eliminar el beneficiario
  /api/cash-register-audits:
    get:
      summary: Listar arqueos de caja
      tags:
        - Arqueos de caja
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de arqueos de caja
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashRegisterAuditCollection'
        '401':
          description: Error de autorización
    post:
      summary: Crear un nuevo arqueo de caja
      tags:
        - Arqueos de caja
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreCashRegisterAuditRequest'
      responses:
        '201':
          description: Arqueo creado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Arqueo creado exitosamente
        '400':
          description: Error de validación
        '401':
          description: Error de autorización
        '500':
          description: Error al crear el arqueo
  /api/cash-register-audits/{id}:
    get:
      summary: Obtener arqueo de caja por ID
      tags:
        - Arqueos de caja
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Arqueo encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashRegisterAuditResource'
        '401':
          description: Error de autorización
        '404':
          description: Recurso no encontrado
    delete:
      summary: Eliminar un arqueo de caja
      tags:
        - Arqueos de caja
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Arqueo eliminado exitosamente
          content:
            application/json:
              schema:
                type: string
                example: Arqueo eliminado exitosamente
        '401':
          description: Error de autorización
        '404':
          description: Recurso no encontrado
  /api/cash-register-audits/amounts:
    get:
      summary: Obtener totales de arqueo de caja por rango de fechas
      tags:
        - Arqueos de caja
      security:
        - bearerAuth: []
      parameters:
        - name: start_date
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: Fecha de inicio del rango
        - name: end_date
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: Fecha de fin del rango
      responses:
        '200':
          description: Totales de arqueo de caja por rango de fechas
          content:
            application/json:
              schema:
                type: object
                properties:
                  amounts:
                    type: object
                    properties:
                      system_cash:
                        type: number
                        format: float
                      system_cash_remaining:
                        type: number
                        format: float
                      system_additional:
                        type: number
                        format: float
        '401':
          description: Error de autorización
  /api/report-categories:
