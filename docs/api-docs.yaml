      type: object
      properties:
        code:
          type: string
        description:
          type: string
      required:
        - code
        - description
    UpdateAdditionalObservationRequest:
      type: object
      properties:
        code:
          type: string
        description:
          type: string
      required:
        - code
        - description
    AdditionalPaymentResource:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        address:
          type: string
        concept:
          type: string
        notes:
          type: string
        subtotal:
          type: number
        vat:
          type: number
        total:
          type: number
        payment_folio:
          type: string
        payment_type_id:
          type: integer
        payment_type_name:
          type: string
        discount:
          type: number
        total_text:
          type: string
        canceled:
          type: boolean
        note:
          type: string
