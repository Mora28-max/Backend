openapi: 3.0.3
paths:
  /api/cash-register-audits:
    get:
      summary: Listar arqueos de caja
      tags:
        - Arqueos de caja
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de arqueos de caja
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashRegisterAuditCollection"
        "401":
          description: Error de autorización
    post:
      summary: Crear un nuevo arqueo de caja
      tags:
        - Arqueos de caja
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreCashRegisterAuditRequest"
      responses:
        "201":
          description: Arqueo creado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Arqueo creado exitosamente
        "401":
          description: Error de autorización
        "400":
          description: Error de validación
        "500":
          description: Error al crear el arqueo
  /api/cash-register-audits/{id}:
    get:
      summary: Obtener arqueo de caja por ID
      tags:
        - Arqueos de caja
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Arqueo encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashRegisterAuditResource"
        "404":
          description: Recurso no encontrado
        "401":
          description: Error de autorización
    delete:
      summary: Eliminar un arqueo de caja
      tags:
        - Arqueos de caja
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Arqueo eliminado exitosamente
          content:
            application/json:
              schema:
                type: string
                example: Arqueo eliminado exitosamente
        "404":
          description: Recurso no encontrado
        "401":
          description: Error de autorización
  /api/cash-register-audits/amounts:
    get:
      summary: Obtener totales de arqueo de caja por rango de fechas
      tags:
        - Arqueos de caja
      security:
        - bearerAuth: []
      parameters:
        - name: start_date
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: Fecha de inicio del rango
        - name: end_date
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: Fecha de fin del rango
      responses:
        "200":
          description: Totales de arqueo de caja por rango de fechas
          content:
            application/json:
              schema:
                type: object
                properties:
                  amounts:
                    type: object
                    properties:
                      system_cash:
                        type: number
                        format: float
                      system_cash_remaining:
                        type: number
                        format: float
                      system_additional:
                        type: number
                        format: float
        "401":
          description: Error de autorización

components:
  schemas:
    CashRegisterAuditResource:
      type: object
      properties:
        issued_by:
          type: string
        receiver:
          type: string
        witness:
          type: string
        counted_cash:
          type: number
          format: float
        system_cash:
          type: number
          format: float
        discrepancy:
          type: number
          format: float
        notes:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        details:
          type: object
        created_at:
          type: string
          format: date-time

    CashRegisterAuditCollection:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CashRegisterAuditResource"
        current_page:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer

    StoreCashRegisterAuditRequest:
      type: object
      properties:
        counted_cash:
          type: number
          format: float
        receiver_user_id:
          type: integer
        witness_user_id:
          type: integer
        notes:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        details:
          type: object
      required:
        - counted_cash
        - receiver_user_id
        - witness_user_id
        - started_at
