openapi: 3.0.3
paths:
  /api/users:
    get:
      summary: Listar usuarios activos
      tags:
        - Usuarios
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de usuarios activos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCollection"
        "401":
          description: No autorizado

    post:
      summary: Registrar usuario (no permitido)
      tags:
        - Usuarios
      security:
        - bearerAuth: []
      responses:
        "405":
          description: Registro no permitido
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string

  /api/users/{id}:
    get:
      summary: Obtener usuario por ID
      tags:
        - Usuarios
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResource"
        "404":
          description: Usuario no encontrado

    put:
      summary: Actualizar usuario
      tags:
        - Usuarios
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRequest"
      responses:
        "201":
          description: Usuario actualizado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  user:
                    $ref: "#/components/schemas/UserResource"
        "401":
          description: No autorizado

    patch:
      summary: Actualizar parcialmente usuario
      tags:
        - Usuarios
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRequest"
      responses:
        "201":
          description: Usuario actualizado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  user:
                    $ref: "#/components/schemas/UserResource"
        "401":
          description: No autorizado

    delete:
      summary: Eliminar usuario
      tags:
        - Usuarios
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmation_password:
                  type: string
      responses:
        "201":
          description: Usuario eliminado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
        "401":
          description: No autorizado

  /api/users/assign-role:
    post:
      summary: Asignar rol a usuario
      tags:
        - Usuarios
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignRoleRequest"
      responses:
        "201":
          description: Rol asignado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  user:
                    $ref: "#/components/schemas/UserResource"
        "401":
          description: No autorizado

components:
  schemas:
    UserResource:
      type: object
      properties:
        id:
          type: integer
        firstname:
          type: string
        lastname:
          type: string
        email:
          type: string
        phone:
          type: string
        role:
          type: string

    UserCollection:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/UserResource"
        current_page:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer

    UserRequest:
      type: object
      properties:
        firstname:
          type: string
        lastname:
          type: string
        email:
          type: string
        phone:
          type: string
        confirmation_password:
          type: string
      required:
        - firstname
        - lastname
        - email
        - phone
        - confirmation_password

    AssignRoleRequest:
      type: object
      properties:
        user_id:
          type: integer
        role:
          type: string
        password:
          type: string
      required:
        - user_id
        - role
        - password
