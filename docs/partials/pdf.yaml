openapi: 3.0.3
paths:
  /api/pdf/receipt/{folio}:
    get:
      summary: Descargar recibo de pago en PDF
      tags:
        - PDF
      security:
        - bearerAuth: []
      parameters:
        - name: folio
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Recibo de pago PDF generado exitosamente
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Recibo no encontrado
        "400":
          description: Folio inválido

