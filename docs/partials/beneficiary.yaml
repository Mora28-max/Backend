openapi: 3.0.3
paths:
  /api/beneficiaries:
    get:
      summary: Listar todos los beneficiarios
      tags:
        - Beneficiarios
      security:
        - bearerAuth: []
      parameters:
        - name: customer_id
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Lista de beneficiarios
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BeneficiaryCollection"
        "401":
          description: Error de autorización
    post:
      summary: Crear un nuevo beneficiario
      tags:
        - Beneficiarios
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreBeneficiaryRequest"
      responses:
        "201":
          description: Beneficiario creado exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BeneficiaryResource"
        "401":
          description: Error de autorización
        "404":
          description: Recurso no encontrado
  /api/beneficiaries/{id}:
    get:
      summary: Obtener un beneficiario por ID
      tags:
        - Beneficiarios
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Beneficiario encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BeneficiaryResource"
        "404":
          description: Recurso no encontrado
        "500":
          description: Error al obtener el beneficiario
    put:
      summary: Actualizar un beneficiario existente
      tags:
        - Beneficiarios
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBeneficiaryRequest"
      responses:
        "200":
          description: Beneficiario actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BeneficiaryResource"
        "404":
          description: Recurso no encontrado
        "500":
          description: Error al actualizar el beneficiario
    delete:
      summary: Eliminar un beneficiario existente
      tags:
        - Beneficiarios
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Beneficiario eliminado exitosamente
        "404":
          description: Recurso no encontrado
        "500":
          description: Error al eliminar el beneficiario

components:
  schemas:
    BeneficiaryResource:
      type: object
      properties:
        id:
          type: integer
        customer_id:
          type: integer
        phone:
          type: string
        email:
          type: string
        firstname:
          type: string
        lastname:
          type: string
        kind:
          type: string
        fullname:
          type: string
    BeneficiaryCollection:
      type: array
      items:
        $ref: "#/components/schemas/BeneficiaryResource"
    StoreBeneficiaryRequest:
      type: object
      properties:
        customer_id:
          type: integer
        phone:
          type: string
        email:
          type: string
        firstname:
          type: string
        lastname:
          type: string
        kind:
          type: string
      required:
        - customer_id
        - phone
        - firstname
        - lastname
        - kind
    UpdateBeneficiaryRequest:
      type: object
      properties:
        customer_id:
          type: integer
        phone:
          type: string
        email:
          type: string
        firstname:
          type: string
        lastname:
          type: string
        kind:
          type: string
