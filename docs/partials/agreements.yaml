openapi: 3.0.3
paths:
  /api/payment-agreements:
    get:
      summary: Listar convenios de pago
      tags: [Convenios]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de convenios
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgreementCollection"
        "401":
          description: No autorizado
    post:
      summary: Crear un nuevo convenio de pago
      tags: [Convenios]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreAgreementRequest"
      responses:
        "201":
          description: Convenio creado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgreementResource"
        "401":
          description: No autorizado
        "500":
          description: Error al crear el convenio
  /api/payment-agreements/{id}:
    get:
      summary: Obtener convenio por ID
      tags: [Convenios]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Convenio encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgreementResource"
        "404":
          description: Convenio no encontrado
        "401":
          description: No autorizado
    delete:
      summary: Cancelar convenio
      tags: [Convenios]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Convenio cancelado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Convenio eliminado exitosamente.
        "404":
          description: Convenio no encontrado
        "500":
          description: Error al cancelar el convenio
  /api/payment-agreements/customer/{id}:
    get:
      summary: Listar fechas de pago de convenio por cliente
      tags: [Convenios]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Fechas de pago encontradas
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment_agreement:
                    $ref: "#/components/schemas/AgreementResource"
                  breakdown_agreement_payments:
                    $ref: "#/components/schemas/BreakdownAgreementPaymentCollection"
        "404":
          description: Convenio no encontrado
        "401":
          description: No autorizado
  /api/payment-agreements/breakdown_agreement/{id}:
    post:
      summary: Realizar pago parcial de convenio
      tags: [Convenios]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Pago realizado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Pago realizado exitosamente.
        "404":
          description: Convenio no encontrado
        "500":
          description: Error al realizar el pago
  /api/payment-agreements/report/{id}:
    post:
      summary: Generar reporte por incumplimiento de convenio
      tags: [Convenios]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reporte generado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  message:
                    type: string
                    example: Reporte generado correctamente.
        "404":
          description: Convenio no encontrado
        "500":
          description: Error al generar el reporte
  /api/payment-agreements/filter-date:
    get:
      summary: Filtrar pagos de convenio por mes y año
      tags: [Convenios]
      security:
        - bearerAuth: []
      parameters:
        - name: month
          in: query
          required: false
          schema:
            type: string
            example: "08"
        - name: year
          in: query
          required: false
          schema:
            type: string
            example: "2025"
      responses:
        "200":
          description: Lista de pagos filtrados por mes y año
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreakdownAgreementPaymentCollection"
        "401":
          description: No autorizado

components:
  schemas:
    AgreementResource:
      type: object
      properties:
        id:
          type: integer
        customer_id:
          type: integer
        customer:
          type: string
        tracking_folio:
          type: string
        initial_payment_amount:
          type: number
        payment_days:
          type: array
          items:
            type: string
            format: date-time
        total_debt:
          type: number
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AgreementCollection:
      type: array
      items:
        $ref: "#/components/schemas/AgreementResource"
    StoreAgreementRequest:
      type: object
      properties:
        customer_id:
          type: integer
        id_months_to_pay:
          type: array
          items:
            type: integer
        payment_type_id:
          type: integer
        payment_breakdown:
          type: string
      required:
        - customer_id
        - id_months_to_pay
        - payment_type_id
        - payment_breakdown
    BreakdownAgreementPaymentResource:
      type: object
      properties:
        id:
          type: integer
        agreement_id:
          type: integer
        amount:
          type: number
        payment_date:
          type: string
          format: date-time
        payment_id:
          type: integer
        non_compliance:
          type: boolean
    BreakdownAgreementPaymentCollection:
      type: array
      items:
        $ref: "#/components/schemas/BreakdownAgreementPaymentResource"
