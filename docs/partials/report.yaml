openapi: 3.0.3
paths:
  /api/reports:
    get:
      summary: Listar todos los reportes
      tags:
        - Reportes
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de reportes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportCollection"
        "401":
          description: No autorizado
    post:
      summary: Crear un nuevo reporte
      tags:
        - Reportes
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreReportRequest"
      responses:
        "201":
          description: Reporte creado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResource"
        "401":
          description: No autorizado
        "500":
          description: Error al crear el reporte
  /api/reports/{id}:
    get:
      summary: Obtener un reporte por ID
      tags:
        - Reportes
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reporte encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResource"
        "404":
          description: Reporte no encontrado
        "401":
          description: No autorizado
    patch:
      summary: Actualizar un reporte existente
      tags:
        - Reportes
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReportRequest"
      responses:
        "200":
          description: Reporte actualizado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResource"
        "404":
          description: Reporte no encontrado
        "500":
          description: Error al actualizar el reporte
    delete:
      summary: Eliminar un reporte existente
      tags:
        - Reportes
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reporte cancelado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Reporte cancelado correctamente.
        "404":
          description: Reporte no encontrado
        "500":
          description: Error al eliminar el reporte
  /api/filter-reports:
    post:
      summary: Filtrar reportes
      tags:
        - Reportes
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FilterReportRequest"
      responses:
        "200":
          description: Lista de reportes filtrados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportCollection"
        "401":
          description: No autorizado
  /api/report-be-paid/{id}:
    post:
      summary: Marcar reporte como obligatorio de pago
      tags:
        - Reportes
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: El reporte ha sido registrado como obligatorio de pago
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: El reporte ha sido registrado a obligatorio ser pagado.
        "409":
          description: Error de negocio
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Error al marcar como obligatorio de pago.
  /api/reports-geo-data:
    get:
      summary: Obtener datos geográficos del reporte
      tags:
        - Reportes
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Datos geográficos del reporte
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        "401":
          description: No autorizado
  /api/verify-report-status/{tracking_folio}:
    get:
      summary: Verificar el estado de un reporte por folio de seguimiento
      tags:
        - Reportes
      security:
        - bearerAuth: []
      parameters:
        - name: tracking_folio
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Proceso verificado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Proceso verificado.
        "404":
          description: Reporte no encontrado
        "401":
          description: No autorizado
  /api/report-notes/{id}/images:
    post:
      summary: Agregar imágenes a la nota de reporte
      tags:
        - Notas de reporte
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                images:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        "200":
          description: Imágenes agregadas correctamente
          content:
            application/json:
              schema:
                type: object
        "401":
          description: No autorizado
  /api/report-materials:
    get:
      summary: Listar materiales de reporte
      tags:
        - Materiales de reporte
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de materiales de reporte
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        "401":
          description: No autorizado
    post:
      summary: Crear material de reporte
      tags:
        - Materiales de reporte
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: Material creado correctamente
          content:
            application/json:
              schema:
                type: object
        "401":
          description: No autorizado
    delete:
      summary: Eliminar material de reporte
      tags:
        - Materiales de reporte
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Material eliminado correctamente
          content:
            application/json:
              schema:
                type: object
        "401":
          description: No autorizado

components:
  schemas:
    ReportResource:
      type: object
      properties:
        id:
          type: integer
        customer_id:
          type: integer
        attended_name:
          type: string
        client_backup_contacts_name:
          type: string
        # Agrega aquí más propiedades según tu modelo Report
    ReportCollection:
      type: array
      items:
        $ref: "#/components/schemas/ReportResource"
    StoreReportRequest:
      type: object
      properties:
        # Agrega aquí los campos requeridos para crear un reporte
        customer_id:
          type: integer
        attended_name:
          type: string
        client_backup_contacts_name:
          type: string
        # ...
      required:
        - customer_id
        - attended_name
    UpdateReportRequest:
      type: object
      properties:
        # Agrega aquí los campos que se pueden actualizar
        attended_name:
          type: string
        client_backup_contacts_name:
          type: string
        # ...
    FilterReportRequest:
      type: object
      properties:
        search:
          type: string
        categories:
          type: array
          items:
            type: integer
        subcategories:
          type: array
          items:
            type: integer
        process_status_id:
          type: string
      required:
        - search
        - categories
        - subcategories
        -
