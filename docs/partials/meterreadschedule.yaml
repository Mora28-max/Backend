openapi: 3.0.3
paths:
  /api/meter-reading-schedules:
    get:
      summary: Listar apartados de lectura de medidor del usuario autenticado
      tags:
        - Agenda de Lectura del Medidor
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de apartados de lectura
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeterReadingScheduleCollection"
        "401":
          description: No autorizado
    post:
      summary: Crear un nuevo apartado de lectura de medidor
      tags:
        - Agenda de Lectura del Medidor
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreMeterReadScheduleRequest"
      responses:
        "201":
          description: Apartado creado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  meter_reading_schedule:
                    $ref: "#/components/schemas/MeterReadingScheduleResource"
        "500":
          description: Error al crear el apartado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  error:
                    type: string
        "401":
          description: No autorizado
  /api/meter-reading-schedules/{id}:
    get:
      summary: Obtener un apartado de lectura por ID
      tags:
        - Agenda de Lectura del Medidor
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Apartado encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeterReadingScheduleResource"
        "404":
          description: Apartado no encontrado
        "401":
          description: No autorizado
    patch:
      summary: Actualizar un apartado de lectura
      tags:
        - Agenda de Lectura del Medidor
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeterReadScheduleRequest"
      responses:
        "200":
          description: Apartado actualizado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  meter_reading_schedule:
                    $ref: "#/components/schemas/MeterReadingScheduleResource"
        "500":
          description: Error al actualizar el apartado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "401":
          description: No autorizado
    delete:
      summary: Eliminar un apartado de lectura
      tags:
        - Agenda de Lectura del Medidor
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Apartado eliminado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "404":
          description: Apartado no encontrado
        "409":
          description: No se puede eliminar el apartado ya procesado
        "500":
          description: Error al eliminar el apartado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "401":
          description: No autorizado
  /api/meter-reading-finished:
    get:
      summary: Listar apartados de lectura finalizados
      tags:
        - Agenda de Lectura del Medidor
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de apartados finalizados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeterReadingScheduleCollection"
        "404":
          description: No se encontraron registros
        "401":
          description: No autorizado

components:
  schemas:
    MeterReadingScheduleResource:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        process_status_id:
          type: integer
        scheduled_date:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        # Agrega aquí más propiedades según tu modelo MeterReadingSchedule
    MeterReadingScheduleCollection:
      type: array
      items:
        $ref: "#/components/schemas/MeterReadingScheduleResource"
    StoreMeterReadScheduleRequest:
      type: object
      properties:
        scheduled_date:
          type: string
          format: date-time
        # Agrega aquí los campos requeridos para crear un apartado
      required:
        - scheduled_date
    UpdateMeterReadScheduleRequest:
      type: object
      properties:
        scheduled_date:
          type: string
          format: date-time
        # Agrega aquí los campos que
