openapi: 3.0.3
paths:
  /api/customer-view/login:
    post:
      summary: Autenticar cliente
      tags:
        - Autenticación del Cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginCustomerRequest"
      responses:
        "200":
          description: Cliente autenticado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAuthResource"
        "401":
          description: Credenciales inválidas
        "404":
          description: Usuario no encontrado
  /api/customer-view/register:
    post:
      summary: Registrar un nuevo cliente
      tags:
        - Autenticación del Cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterCustomerRequest"
      responses:
        "201":
          description: Cliente registrado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAuthResource"
        "401":
          description: Error de autorización
        "422":
          description: Datos inválidos
  /api/customer-view/logout:
    post:
      summary: Cerrar sesión del cliente
      tags:
        - Autenticación del Cliente
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sesión cerrada correctamente
        "401":
          description: Token inválido o no proporcionado
  /api/customer-view/verify-token:
    post:
      summary: Verificar token y obtener datos básicos del cliente
      tags:
        - Autenticación del Cliente
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Token válido, datos básicos del cliente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyTokenResource"
        "401":
          description: Token inválido o expirado

components:
  schemas:
    CustomerAuthResource:
      type: object
      properties:
        id:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        phone:
          type: string
        token:
          type: string
        fullname:
          type: string
      required:
        - id
        - first_name
        - last_name
        - phone
        - token

    VerifyTokenResource:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required:
        - id
        - name

    LoginCustomerRequest:
      type: object
      properties:
        customer_id:
          type: integer
        phone:
          type: string
      required:
        - customer_id
        - phone

    RegisterCustomerRequest:
      type: object
      properties:
        customer_id:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        phone:
          type: string
      required:
        - customer_id
        - first_name
        - last_name
        - phone
